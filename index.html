  async function copyText(text) {

      toast('已复制。分享之前，再看一眼。');
      return;
    } catch (_) {
      const input = document.createElement('textarea');
      input.value = text;
      input.setAttribute('readonly','');
      input.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(input); input.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { /* 使用下面的人工复制回退。 */ }
      input.remove();
      if (ok) toast('已复制。分享之前，再看一眼。');
      else {
        showModal('请手动复制', `<p class="modal-message">当前浏览器不允许自动复制。可以选中下方文字，使用系统复制菜单。</p><textarea class="modal-text" readonly aria-label="待复制文字">${esc(text)}</textarea>`);
        modal.querySelector('textarea')?.select();
      }
    }
  }

        if(!integer(index,0,2))return;phraseIndex=index;
        document.getElementById('phrase-text').value=PHRASES[index].text;
        document.querySelectorAll('[data-action="phrase"]').forEach(b=>{const selected=Number(b.dataset.index)===index;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});break;
      }
      case 'copy-phrase':await copyText(document.getElementById('phrase-text').value);break;
      case 'commitment':if(integer(index,0,3)){state.commitment=index;state.custom='';saveState();render({preserveScroll:true});}break;
      case 'download-card': {
        if(!(await ensureCurrentCard())){toast('图片正在更新，请稍后再试。');return;}
        downloadFile(cardCache.url,cardCache.name);toast('已发起图片保存。未出现下载时，可打开大图尝试长按保存。');break;
      }
      case 'preview-card': {
        if(!(await ensureCurrentCard())){toast('图片正在更新，请稍后再试。');return;}
        showModal('我的行动卡',`<p class="modal-message">手机上可尝试长按下方图片保存；也可返回使用“保存行动卡”。不会自动上传。</p><img class="modal-image" src="${esc(cardCache.url)}" alt="我的校园网络文明行动卡">`);break;
      }
      case 'copy-share': {
        let text='在《转发之前》，我走进了六个虚构的校园网络现场。看线索、做选择、看到后续，练习让善意先到场。情境虚构，AI辅助创作。';
        if(localPreview())text+='\n当前是本地体验文件，正式发布后可在这里附上作品公网链接。';
        else{const url=new URL(location.href);url.search='';url.hash='home';text+='\n'+url.href;}
        await copyText(text);break;
      }
      case 'export-records':exportRecords();break;
      case 'ask-reset':showModal('清除本机记录？','<p class="modal-message">将清除本作品在此浏览器保存的故事进度、选择、自查状态和自写行动句。已导出的文件不会被删除，其他网站的数据不会受影响。此操作无法撤销。</p><div class="actions"><button class="button secondary" data-action="close-modal">先保留</button><button class="button orange" data-action="confirm-reset">确认清除</button></div>');break;
      case 'confirm-reset':state=fresh();try{localStorage.removeItem(KEY);}catch(_){storageAvailable=false;}modal.close();saveState();render();toast(storageAvailable?'本作品的本机记录已重置，其他网站数据未改动。':'当前体验已重置；本机存储不可用，旧存储可能未清除。');break;
      case 'close-modal':modal.close();break;
    }
  });
  document.addEventListener('toggle', event => {
    const detail=event.target;
    if(!(detail instanceof HTMLDetailsElement)||!detail.hasAttribute('data-evidence')||!detail.open)return;
    const id=Number(detail.dataset.scene), index=Number(detail.dataset.evidence);
    if(!integer(id,0,5)||!integer(index,0,2))return;
    const draft=draftFor(id);
    if(!draft.evidence.includes(index)){
      draft.evidence.push(index);saveState();
      const label=document.getElementById('evidence-read-count');if(label)label.textContent=`已查阅 ${draft.evidence.length} / 3`;
    }
  },true);
  document.addEventListener('input', event => {
    if(event.target.id!=='custom-commitment')return;
    state.custom=Array.from(event.target.value).slice(0,36).join('');saveState();
    const saveButton=document.getElementById('download-card');if(saveButton)saveButton.disabled=true;
    document.querySelectorAll('[data-action="commitment"]').forEach(b=>{const selected=!state.custom&&Number(b.dataset.index)===state.commitment;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});
    clearTimeout(cardTimer);cardTimer=setTimeout(()=>{if(currentRoute.view==='card')generateCard();},150);
  });
  modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)modal.close();}});
  window.addEventListener('hashchange',()=>{if(location.hash==='#main'){main.focus();return;}if(modal.open)modal.close();render();});
  window.addEventListener('beforeunload',()=>{if(cardCache)URL.revokeObjectURL(cardCache.url);});
  render();
  if(recovered)toast('原有进度格式无法读取，已从新体验开始。其他网站数据未改动。');
})();
</script>
</body>
</html>
